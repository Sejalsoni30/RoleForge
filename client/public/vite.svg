<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="rf-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="40%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Top Fold / Blade -->
    <linearGradient id="rf-blade-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>

    <!-- Lower Fold / Anvil Base -->
    <linearGradient id="rf-blade-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Glowing Forge Spark -->
    <linearGradient id="rf-spark-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <filter id="rf-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E1B4B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="64" height="64" rx="16" fill="url(#rf-bg-grad)" />
  <!-- Gloss highlight rim -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="white" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- The "Forge & Compiler" Monogram Symbol -->
  <g filter="url(#rf-drop-shadow)">
    <!-- Main Vertical Column / Spine of the Document -->
    <path d="M18 16C18 14.8954 18.8954 14 20 14H28C29.1046 14 30 14.8954 30 16V48C30 49.1046 29.1046 50 28 50H20C18.8954 50 18 49.1046 18 48V16Z" fill="url(#rf-blade-top)" />

    <!-- Upper Compiler Arm (Precision Job Beam) -->
    <path d="M28 14H42C44.2091 14 45.47 16.5173 44.11 18.2616L39.11 24.6756C38.4116 25.5727 37.3377 26.0963 36.1969 26.0963H28V14Z" fill="url(#rf-blade-top)" />

    <!-- Middle Compiler Arm (Resume Adaptation Beam) -->
    <path d="M28 28H37C39.1415 28 40.4042 30.3951 39.1869 32.1528L35.6869 37.2028C35.0116 38.0772 33.9575 38.5878 32.8458 38.5878H28V28Z" fill="url(#rf-blade-mid)" />

    <!-- Compiler Forge Core Spark (Cyan Diamond Star) -->
    <polygon points="46,38 49,32 52,38 49,44" fill="url(#rf-spark-glow)" />
    <circle cx="49" cy="38" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
