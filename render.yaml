services:
  - type: web
    name: roleforge-server
    env: node
    plan: starter
    buildCommand: npm install && npm run build --workspace=@roleforge/shared && npm run build --workspace=@roleforge/server
    startCommand: npm run start --workspace=@roleforge/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://roleforge.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

