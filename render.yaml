services:
  - type: web
    name: roleforge-server
    env: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build:server
    startCommand: npm run start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://roleforge.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
